<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Soundscape Stem Inspector</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; display: grid; grid-template-columns: 220px 1fr 260px; height: 100vh;
             background: #16161a; color: #ddd; font: 13px/1.4 ui-monospace, monospace; }
      #sidebar { overflow-y: auto; border-right: 1px solid #2a2a30; padding: 8px; }
      #sidebar h3 { margin: 10px 0 2px; color: #9a9aa5; font-size: 12px; text-transform: uppercase; }
      #sidebar h4 { margin: 6px 0 2px 8px; color: #6ea8dc; font-size: 12px; }
      #sidebar button { display: block; width: calc(100% - 16px); margin: 1px 0 1px 16px; padding: 2px 6px;
                        text-align: left; background: none; border: 0; color: #ddd; cursor: pointer; }
      #sidebar button:hover, #sidebar button.active { background: #2a2a30; }
      #main { display: flex; flex-direction: column; min-width: 0; }
      #canvas { width: 100%; flex: 1; }
      #transport { display: flex; gap: 8px; align-items: center; padding: 8px; border-top: 1px solid #2a2a30; }
      #transport button { background: #2a2a30; color: #ddd; border: 0; padding: 4px 12px; cursor: pointer; }
      #knobs { overflow-y: auto; border-left: 1px solid #2a2a30; padding: 8px; }
      #knobs label { display: flex; justify-content: space-between; gap: 6px; margin: 4px 0; }
      #knobs input[type="number"] { width: 70px; background: #222228; color: #ddd; border: 1px solid #2a2a30; }
      #knobs h3 { margin: 12px 0 4px; color: #9a9aa5; font-size: 12px; text-transform: uppercase; }
      #error { color: #ff7a7a; padding: 8px; white-space: pre-wrap; }
      #readout { padding: 0 8px 4px; color: #9a9aa5; }
      #settings-out { width: 100%; height: 90px; background: #222228; color: #9a9aa5; border: 1px solid #2a2a30; }
      .note { color: #6b6b75; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="sidebar"></div>
    <div id="main">
      <div id="error" hidden></div>
      <canvas id="canvas"></canvas>
      <div id="readout"></div>
      <div id="transport"></div>
    </div>
    <div id="knobs"></div>
    <script type="module" src="/src/viz/runtime/dev/stemInspector/main.ts"></script>
  </body>
</html>
