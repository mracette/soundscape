appId: world.soundscape.desktop
productName: Soundscape
directories:
  output: dist
files:
  - src/**/*
  - package.json
extraResources:
  - from: ../../build
    to: app
    filter:
      - "**/*"
      - "!audio/wav/**/*"
mac:
  target: dmg
  category: public.app-category.music
win:
  target: nsis
linux:
  target: AppImage
  category: Audio
