name: CI
on:
  push:
    branches: [master, 2026-overhaul, quality]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec eslint src/
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          # Audio/model assets are gitignored and absent in CI; fetch them from the
          # CDN instead (requires permissive CORS on the CloudFront distribution).
          REACT_APP_ASSET_LOCATION: cloudfront
          REACT_APP_ASSET_DOMAIN: https://cdn.soundscape.world
